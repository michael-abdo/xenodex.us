<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <!-- Gradient for the circle -->
    <linearGradient id="cycleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0C0C0;stop-opacity:1" />
    </linearGradient>
    <!-- Smaller, refined arrowheads -->
    <marker id="cycleArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" fill="#888888">
      <path d="M 0 0 L 8 3 L 0 6 z" />
    </marker>
  </defs>
  
  <!-- Background circle -->
  <circle cx="160" cy="160" r="70" fill="none" stroke="url(#cycleGradient)" stroke-width="3" opacity="0.3"/>
  
  <!-- Four arc segments with arrows -->
  <path d="M 160 90 A 70 70 0 0 1 230 160" fill="none" stroke="#888888" stroke-width="3" stroke-linecap="round" marker-end="url(#cycleArrow)" opacity="0.7"/>
  <path d="M 230 160 A 70 70 0 0 1 160 230" fill="none" stroke="#888888" stroke-width="3" stroke-linecap="round" marker-end="url(#cycleArrow)" opacity="0.7"/>
  <path d="M 160 230 A 70 70 0 0 1 90 160" fill="none" stroke="#888888" stroke-width="3" stroke-linecap="round" marker-end="url(#cycleArrow)" opacity="0.7"/>
  <path d="M 90 160 A 70 70 0 0 1 160 90" fill="none" stroke="#888888" stroke-width="3" stroke-linecap="round" marker-end="url(#cycleArrow)" opacity="0.7"/>
  
  <!-- Text labels -->
  <text x="160" y="50" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Benchmark</text>
  <text x="270" y="165" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Profile</text>
  <text x="160" y="280" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Optimize</text>
  <text x="50" y="165" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Validate</text>
</svg>